name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      INQUIRY_MOCK_DELIVERY: sent
      INQUIRY_FROM_EMAIL: KodRoot <hello@mail.kodroot.com>
      INQUIRY_TO_EMAIL: hello@kodroot.com
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - id: e2e
        run: npx playwright test --project=chromium
        env:
          CI: true
          E2E_PRODUCTION: "1"
          INQUIRY_MOCK_DELIVERY: sent
      - uses: actions/upload-artifact@v7
        if: failure() && steps.e2e.outcome == 'failure'
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
